# Secret Manager secrets, for every environment. Read by
# environments/<env>/secrets/. NO SECRET VALUES IN THIS FILE OR THIS REPO:
# Terraform creates the secret and its access; the value is added afterwards in
# the Secret Manager console or with
#   gcloud secrets versions add <secret-id> --project=<project> --data-file=-
#
# Each key is the secret ID, the same in every env listed in `envs`, so code
# reads projects/<project>/secrets/<id>/versions/latest and only switches
# project. Promote by adding an env to `envs`.
#
# Fields (all optional except envs):
#   envs               [dev, test, prod]: where the secret exists
#   accessors          who may read the value: principal names from
#                      environments/principals.yaml (composer, ...) or literal
#                      IAM members ("serviceAccount:x@y.iam.gserviceaccount.com")
#   description, labels
#   replica_locations  e.g. [europe-west4]; default lets Google choose
#
# Keys starting with "_" are examples and are ignored.

_steam-api-key:
  description: Steam Web API key for the steam scrapers
  envs: [dev, test]
  accessors: [composer]
